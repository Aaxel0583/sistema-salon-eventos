{# Un solo contacto real (TELEFONO_NEGOCIO en .env). Sin teléfono no se muestra: una frase sin destino no ayuda. #}
{% if telefono_negocio %}
<p class="contacto-salon">
  ¿Algo no coincide con lo que acordaste? Llama o escribe a {{ nombre_negocio }}:
  <a href="tel:{{ telefono_negocio|replace(' ', '') }}">{{ telefono_negocio|contacto }}</a>.
</p>
{% endif %}
